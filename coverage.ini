[coverage]
# You run the harness from px4/, so repo_root is the current directory
repo_root = .

# PX4 build dir relative to repo_root
build_dir = PX4-Autopilot/build/px4_sitl_default

# AFL findings dir relative to repo_root
fallback_findings_dir = findings

# Store everything coverage-related under findings/
reports_subdir = coverage_reports

# Timing
interval_sec = 300
startup_delay_sec = 15

# lcov/genhtml behavior
lcov_ignore_errors = mismatch,version,gcov,source,inconsistent
genhtml_ignore_errors = empty,inconsistent,source
genhtml_extra_args = --synthesize-missing
synthesize_missing = true

# If you use it, keep it relative to repo_root. Otherwise leave blank.
gcov_tool = scripts/llvm-gcov.sh

# Optional browser behavior (recommend false under AFL)
open_firefox = false
open_first_report = true
open_newest_each_time = true

# NEW: a subdir where you can rsync/copy .gcda/.profraw/.gcov inputs
# relative to the per-run folder
artifacts_subdir = gcov_artifacts
